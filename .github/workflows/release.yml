# Builds Adv770 for the Asciiverse catalog: one archive per target,
# adv770-<target>.tar.gz (.zip on Windows), plus SHA256SUMS, attached to a
# GitHub release (hub/catalog/SCHEMA.md, release.source = "github"). Runs
# on a pushed release tag, v2.33-av.1 (the game's version, then our
# packaging release), or by hand for an existing one.
#
# Console only (-DCONSOLE, asciiverse/build.sh). Linux builds run in Alpine
# and link readline and ncurses statically, so the binaries carry the -musl
# triple av looks for first. macOS links the system's readline (libedit),
# on a runner of each architecture. Windows is cross-built with MinGW,
# without readline (the console's own line editing).

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base readline-dev readline-static ncurses-dev ncurses-static &&
            LDFLAGS="-static -s" LIBS="-lreadline -lncursesw" asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }}'
          sudo chown -R "$(id -u):$(id -g)" .
          file out/adv770

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          LIBS=-lreadline asciiverse/build.sh
          strip out/adv770
          file out/adv770
          if otool -L out/adv770 | tail -n +2 | grep -v -E "^\s*/(usr/lib|System/Library)/"; then
            echo "adv770 links a library outside the system" >&2; exit 1
          fi
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-pc-windows-gnu
      CROSS: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Build and package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
          CC=$CROSS-gcc CFLAGS="-O2 -DNO_READLINE" LIBS= LDFLAGS="-static -s" EXE=.exe asciiverse/build.sh
          file out/adv770.exe
          asciiverse/package.sh $TARGET

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Adventure 770 $TAG" \
                 --notes "Adv770, Mike Arnautov's 770-point Adventure (mipmip.org/adv770), built for the Asciiverse catalog: console play on Linux, macOS and Windows. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
